services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-qmessentials}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - qmessentials-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  apigw:
    build:
      context: ./src/apigw
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      INTAKE_URL: "http://intake:8082"
      CONFIG_URL: "http://localhost:8081"
      WEB_URL: "${WEB_URL}"
    depends_on:
      - intake
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  intake:
    build:
      context: ./src/intake
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      DB_HOST: "${INTAKE_DB_HOST:-postgres}"
      DB_PORT: "${INTAKE_DB_PORT:-5432}"
      DB_NAME: "${INTAKE_DB_NAME:-qmessentials}"
      DB_USER: "${INTAKE_DB_USER:-postgres}"
      DB_PASSWORD: "${INTAKE_DB_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy
      apigw:
        condition: service_started
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  qmessentials-network:
    driver: bridge

volumes:
  postgres-data:
