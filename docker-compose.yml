services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-qme}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-qme}"
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    networks:
      - qmessentials-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./src/utils
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-qmessentials}"
      CONFIGURATION_DB_HOST: "${CONFIGURATION_DB_HOST:-postgres}"
      CONFIGURATION_DB_PORT: "${CONFIGURATION_DB_PORT:-5432}"
      CONFIGURATION_DB_NAME: "${CONFIGURATION_DB_NAME:-qmessentials}"
      CONFIGURATION_DB_USER: "${CONFIGURATION_DB_USER:-postgres}"
      CONFIGURATION_DB_PASSWORD: "${CONFIGURATION_DB_PASSWORD:-postgres}"
      INTAKE_DB_HOST: "${INTAKE_DB_HOST:-postgres}"
      INTAKE_DB_PORT: "${INTAKE_DB_PORT:-5432}"
      INTAKE_DB_NAME: "${INTAKE_DB_NAME:-qmessentials}"
      INTAKE_DB_USER: "${INTAKE_DB_USER:-postgres}"
      INTAKE_DB_PASSWORD: "${INTAKE_DB_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qmessentials-network
    entrypoint: ["/bin/sh", "-c", "cd /app && bash scripts/migrate.sh"]
    volumes:
      - .:/app

  apigw:
    build:
      context: ./src/apigw
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      INTAKE_URL: "http://intake:8082"
      CONFIG_URL: "http://configuration:8081"
      WEB_URL: "${WEB_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      intake:
        condition: service_started
      configuration:
        condition: service_started
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  intake:
    build:
      context: ./src/intake
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      DB_HOST: "${INTAKE_DB_HOST:-postgres}"
      DB_PORT: "${INTAKE_DB_PORT:-5432}"
      DB_NAME: "${INTAKE_DB_NAME:-qmessentials}"
      DB_USER: "${INTAKE_DB_USER:-postgres}"
      DB_PASSWORD: "${INTAKE_DB_PASSWORD:-postgres}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  configuration:
    build:
      context: ./src/configuration
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      DB_HOST: "${CONFIGURATION_DB_HOST:-postgres}"
      DB_PORT: "${CONFIGURATION_DB_PORT:-5432}"
      DB_NAME: "${CONFIGURATION_DB_NAME:-qmessentials}"
      DB_USER: "${CONFIGURATION_DB_USER:-postgres}"
      DB_PASSWORD: "${CONFIGURATION_DB_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "http://localhost:8081/healthz",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  nats:
    image: nats:latest
    command: ["-js", "-m", "8222"]
    restart: on-failure
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    networks:
      - qmessentials-network

  nats-setup:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_started
    networks:
      - qmessentials-network
    command:
      - sh
      - -c
      - |
        until nats stream add TEST_RESULTS \
          --server=nats://nats:4222 \
          --subjects=test-results \
          --retention=workq \
          --storage=file \
          --replicas=1 \
          --defaults; do
          echo "Waiting for NATS..."
          sleep 1
        done

networks:
  qmessentials-network:
    driver: bridge

volumes:
  postgres-data-v18:
