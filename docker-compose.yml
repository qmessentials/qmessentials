services:
  apigw:
    build:
      context: ./src/apigw
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      INTAKE_URL: "http://intake:8082"
      CONFIG_URL: "http://localhost:8081"
    depends_on:
      - intake
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  intake:
    build:
      context: ./src/intake
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-your-shared-secret-change-me}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-qmessentials}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
    networks:
      - qmessentials-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  qmessentials-network:
    driver: bridge
